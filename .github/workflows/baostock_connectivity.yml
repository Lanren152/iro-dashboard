name: baostock-cloud-connectivity

on:
  workflow_dispatch:

jobs:
  test-baostock-reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install baostock
        run: pip install --quiet baostock

      - name: Run connectivity test
        run: python connectivity_test_baostock.py
