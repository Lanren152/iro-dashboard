services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: investment
      POSTGRES_PASSWORD: investment
      POSTGRES_DB: investment
    volumes:
      - investment_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.scheduler"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage

  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.mcp_server"]
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy


volumes:
  investment_pg:
